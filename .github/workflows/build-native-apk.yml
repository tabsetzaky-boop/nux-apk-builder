# بناء APK أصلي (Kotlin + Jetpack Compose) لمشاريع Nux.
# المشروع يُرفع إلى المسار native/<folder> داخل نفس المستودع، ثم يُبنى هنا بـ Gradle،
# ويُوقَّع بمفتاح يُنشأ لكل عملية بناء، ويُنشر في إصدار GitHub باسم native-apk-<build_id>.

name: Build Native APK

run-name: "NAPK ${{ inputs.build_id }}"

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "معرّف البناء في Nux"
        required: true
        type: string
      folder:
        description: "مجلد المشروع داخل native/"
        required: true
        type: string
      app_name:
        description: "اسم التطبيق"
        required: true
        type: string
      version_name:
        description: "رقم الإصدار"
        required: false
        default: "1.0.0"
        type: string

permissions:
  contents: write

concurrency:
  group: native-apk-${{ inputs.build_id }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FOLDER: ${{ inputs.folder }}
      BUILD_ID: ${{ inputs.build_id }}

    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4

      - name: التحقق من مجلد المشروع
        run: |
          set -euo pipefail
          case "$FOLDER" in
            *[!a-zA-Z0-9_-]*) echo "مجلد غير صالح"; exit 1 ;;
          esac
          test -f "native/$FOLDER/settings.gradle"
          echo "المشروع: native/$FOLDER"

      - name: تثبيت JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: تثبيت Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: تثبيت Android SDK
        uses: android-actions/setup-android@v3

      - name: قبول تراخيص Android وتثبيت المنصات
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: إنشاء مفتاح التوقيع
        working-directory: native/${{ inputs.folder }}
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore nux-release.jks \
            -alias nux \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass nuxbuild -keypass nuxbuild \
            -dname "CN=Nux Build, OU=Nux, O=Nux, L=Cairo, C=EG"
          test -f nux-release.jks

      - name: بناء APK
        working-directory: native/${{ inputs.folder }}
        env:
          NUX_KEYSTORE: ${{ github.workspace }}/native/${{ inputs.folder }}/nux-release.jks
          NUX_STORE_PASS: nuxbuild
          NUX_KEY_PASS: nuxbuild
          NUX_KEY_ALIAS: nux
        run: |
          set -euo pipefail
          gradle assembleRelease --no-daemon --stacktrace

      - name: التحقق من التوقيع والمحاذاة
        working-directory: native/${{ inputs.folder }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then echo "لم يُنتج أي APK"; exit 1; fi
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          echo "APK: $APK"
          "$ANDROID_HOME/build-tools/$BT/zipalign" -c -v 4 "$APK" | tail -n 2
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" | tee signature.txt
          cp "$APK" "$GITHUB_WORKSPACE/app-release.apk"

      - name: نشر ملف APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="native-apk-${BUILD_ID}"
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          SIGNATURE=$(head -n 6 "$GITHUB_WORKSPACE/signature.txt" 2>/dev/null || true)
          NOTES="$SIGNATURE"
          gh release create "$TAG" "$GITHUB_WORKSPACE/app-release.apk#app-release.apk" \
            --title "${{ inputs.app_name }} ${{ inputs.version_name }}" \
            --notes "$NOTES"
